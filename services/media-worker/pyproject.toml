[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ao-worker"
version = "0.1.0"
description = "AlexandrineOxiana media worker: transcription, capture download, proxies, OCR"
requires-python = ">=3.12"
# Pinned: the worker ships with the app; gallery-dl updates with app releases (ADR 0009).
dependencies = [
  "faster-whisper==1.2.1",
  # faster-whisper 1.2.1 calls av.open(metadata_errors=...), removed in PyAV 19.
  "av==18.1.0",
  "gallery-dl==1.32.19",
  "pillow==13.0.0",
  "pillow-heif==1.8.1",
  "rawpy==0.28.0",
  "ocrmypdf==17.14.1",
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools]
packages = ["ao_worker"]

[tool.setuptools.package-data]
ao_worker = ["known_phrases.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a speech model on first run"]
