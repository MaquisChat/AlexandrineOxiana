[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ao-worker"
version = "0.1.0"
description = "AlexandrineOxiana media worker: transcription, capture download, proxies, OCR"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
# Pinned: the worker ships with the app. gallery-dl (GPL-2.0-only) is not a dependency any more: the
# first-use tools dialogue downloads its pinned wheel (ao_worker/toolpins.py, Task 48a, ADR 0009).
dependencies = [
  "faster-whisper==1.2.1",
  # faster-whisper 1.2.1 calls av.open(metadata_errors=...), removed in PyAV 19.
  "av==18.1.0",
  # gallery-dl's one dependency (Apache-2.0), kept so the downloaded gallery-dl runs on the worker's Python.
  "requests==2.34.2",
  "pillow==13.0.0",
  "pillow-heif==1.8.1",
  "rawpy==0.28.0",
  "ocrmypdf==17.14.1",
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
# Build-time only: the one-folder sidecar build (packaging/ao-worker.spec, apps/desktop/scripts/build-sidecars.mjs).
packaging = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.10"]

[tool.setuptools]
packages = ["ao_worker"]

[tool.setuptools.package-data]
ao_worker = ["known_phrases.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a speech model on first run"]
