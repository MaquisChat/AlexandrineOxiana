name: Desktop (macOS)

# The two Mac downloads (Task 37f, R133): Apple Silicon built on macos-15, Intel on macos-15-intel,
# each from its own build (no combined app), minimum macOS 15.0, ad-hoc signed (R151; signing with a
# Developer ID and notarisation are Task 37g). macOS runner minutes are billed at ten times Linux ones
# on a private repository, so this workflow NEVER runs on a push to a branch: only when started by
# hand (Actions > "Desktop (macOS)" > "Run workflow") or when a version tag is pushed. A `push`
# trigger with only `tags` does not fire for branch pushes: "If you define only tags/tags-ignore or
# only branches/branches-ignore, the workflow won't run for events affecting the undefined Git ref"
# (docs.github.com, Actions, workflow syntax, on.push.<branches|tags>).
#
# Minutes per architecture, ESTIMATED (nothing has run on a Mac yet; the Linux timings of the same
# steps, scaled for GitHub's 3-core M1 and 4-core Intel machines):
#   cold (no caches): Apple Silicon about 55-75 min, Intel about 65-90 min. The largest parts:
#     installing tauri-cli (8-12), the release shell with LTO (10-15), the debug shell for the launch
#     check (5-8), the worker's venv and PyInstaller (6-10), Homebrew's ffmpeg and tesseract for the
#     checks (5-10), the launch check (4-6).
#   warm (tauri-cli, the Rust build, the worker venv and the Node archive cached): about 30-45 min each.
#   Billed: about 10x those minutes each, so a cold run of both is roughly 1,200-1,650 Linux-equivalent
#   minutes, a warm one 600-900.

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: Which downloads to build
        type: choice
        options: [both, apple-silicon, intel]
        default: both
  push:
    # Version tags only (v1.2.3, v1.2.3-rc.1). No `branches` here: see above.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

# One Mac build at a time across the repository: a second run waits (only the newest waiting run is
# kept) and a run in progress is never cancelled by another.
concurrency:
  group: desktop-macos
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architectures == 'apple-silicon' && '[{"runner":"macos-15","arch":"arm64","label":"apple-silicon"}]' || inputs.architectures == 'intel' && '[{"runner":"macos-15-intel","arch":"x64","label":"intel"}]' || '[{"runner":"macos-15","arch":"arm64","label":"apple-silicon"},{"runner":"macos-15-intel","arch":"x64","label":"intel"}]') }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      PYTHON: python
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      APP_DEBUG: apps/desktop/src-tauri/target/debug/bundle/macos/Alexandrine Oxiana.app
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: The pins (apps/desktop/macos/pins.json) and the machine
        id: pins
        timeout-minutes: 1
        run: |
          pins=apps/desktop/macos/pins.json
          echo "node=$(jq -r .node.version "$pins")" >> "$GITHUB_OUTPUT"
          echo "tauri-cli=$(jq -r .tauriCli "$pins")" >> "$GITHUB_OUTPUT"
          [ "$(jq -r .minimumSystemVersion "$pins")" = "$MACOSX_DEPLOYMENT_TARGET" ] || { echo "::error::MACOSX_DEPLOYMENT_TARGET differs from pins.json"; exit 1; }
          echo "os=$(sw_vers -productVersion)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          machine=$(uname -m); want=${{ matrix.arch }}; [ "$want" = x64 ] && want=x86_64
          [ "$machine" = "$want" ] || { echo "::error::${{ matrix.runner }} is $machine, expected $want"; exit 1; }
          echo "macOS $(sw_vers -productVersion) on $machine; runner image ${ImageOS:-?} ${ImageVersion:-?}; Xcode $(xcodebuild -version 2>/dev/null | head -1)"

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          # The same release the app ships (build-macos.mjs checks that the service folder was built by it).
          node-version: ${{ steps.pins.outputs.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: "3.13"

      - name: Rust 1.97
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          rustc --version

      - name: Rust build cache (crates and the shell's target folder)
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: desktop-macos-rust-1.97.0-${{ matrix.runner }}-${{ steps.pins.outputs.image }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('apps/desktop/src-tauri/src/**', 'apps/desktop/src-tauri/build.rs', 'apps/desktop/src-tauri/*.json', 'apps/desktop/src-tauri/Info.plist', 'apps/desktop/src-tauri/capabilities/**') }}
          restore-keys: |
            desktop-macos-rust-1.97.0-${{ matrix.runner }}-${{ steps.pins.outputs.image }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            desktop-macos-rust-1.97.0-${{ matrix.runner }}-

      - name: tauri-cli cache
        id: tauri-cli
        uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: ~/.cargo-tools
          key: tauri-cli-${{ steps.pins.outputs.tauri-cli }}-rust-1.97.0-${{ matrix.runner }}
      - name: tauri-cli ${{ steps.pins.outputs.tauri-cli }} (pinned; its own lock file)
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: cargo install tauri-cli --version "=${{ steps.pins.outputs.tauri-cli }}" --locked --root ~/.cargo-tools
      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
        timeout-minutes: 1

      - name: Build caches (the pinned Node archive, the worker's build venv)
        uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: |
            apps/desktop/.build/node/*.tar.gz
            apps/desktop/.build/venv-*
          key: desktop-macos-build-${{ matrix.runner }}-${{ steps.pins.outputs.image }}-py3.13-${{ hashFiles('apps/desktop/macos/pins.json', 'services/media-worker/pyproject.toml', 'services/media-worker/packaging/constraints-macos-x86_64.txt') }}

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - name: CSL styles and locales (the service folder ships them)
        timeout-minutes: 5
        run: pnpm fetch-csl

      - name: Build the app and its disk image (build-macos.mjs)
        timeout-minutes: 90
        run: node apps/desktop/scripts/build-macos.mjs --debug-app

      # ---- checks on this machine ----

      - name: Tools the checks hand to the worker (Homebrew; not shipped in the app)
        timeout-minutes: 20
        run: brew install ffmpeg tesseract
      - name: Pinned test fixtures
        timeout-minutes: 5
        run: node scripts/fetch-fixtures.mjs
      - name: The tiny speech model for the worker's smoke test (outside the bundle)
        uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: ~/.cache/ao-worker-smoke-models
          key: ao-worker-smoke-models-tiny-v1-${{ matrix.runner }}
      - name: Packaged worker smoke test (manifest, health, HEIC, proxy, transcription, imports)
        timeout-minutes: 15
        run: node apps/desktop/scripts/build-sidecars.mjs --skip-build --smoke ${{ matrix.arch == 'arm64' && '--constraints none' || '' }}

      - name: Launch check A-E (the debug app bundle; helpers from its own resources)
        timeout-minutes: 20
        run: node apps/desktop/scripts/launch-check.mjs --app "$APP_DEBUG"

      - name: Launch check R (the release app, run from the mounted disk image)
        timeout-minutes: 10
        run: |
          dmg=$(ls apps/desktop/dist-macos/*.dmg)
          mnt="$RUNNER_TEMP/ao-dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -force || true' EXIT
          ls -la "$mnt"
          codesign --verify --deep --strict --verbose=2 "$mnt/Alexandrine Oxiana.app"
          node apps/desktop/scripts/launch-check.mjs --release-app "$mnt/Alexandrine Oxiana.app"

      - name: Sizes and checksums in the run summary
        if: always()
        timeout-minutes: 2
        run: |
          {
            echo "### ${{ matrix.label }} (${{ matrix.runner }}, macOS ${{ steps.pins.outputs.os }})"
            for f in apps/desktop/dist-macos/*.dmg; do [ -f "$f" ] && echo "- \`$(basename "$f")\`: $(du -h "$f" | cut -f1), sha256 \`$(cut -d' ' -f1 "$f.sha256")\`"; done
            app="apps/desktop/src-tauri/target/release/bundle/macos/Alexandrine Oxiana.app"
            [ -d "$app" ] && echo "- the app: $(du -sh "$app" | cut -f1) (worker $(du -sh "$app/Contents/Resources/ao-worker" | cut -f1), service $(du -sh "$app/Contents/Resources/library-service" | cut -f1), Node.js $(du -sh "$app/Contents/Resources/node" | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the disk image and its SHA-256
        uses: actions/upload-artifact@v4
        timeout-minutes: 15
        with:
          name: alexandrine-oxiana-macos-${{ matrix.label }}
          path: |
            apps/desktop/dist-macos/*.dmg
            apps/desktop/dist-macos/*.dmg.sha256
          if-no-files-found: error
          # A disk image is already compressed.
          compression-level: 0
          retention-days: 30

      - name: Upload the worker's manifest and smoke results
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: worker-bundle-report-macos-${{ matrix.label }}
          path: |
            apps/desktop/sidecars/*/sidecar-manifest.json
            apps/desktop/sidecars/*.smoke.json
          if-no-files-found: ignore
