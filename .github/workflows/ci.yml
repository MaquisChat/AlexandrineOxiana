name: CI
on:
  push:
    # A push that changes only documentation does not need the suite (and would cancel a run in progress).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run at a time per branch. A run in progress is allowed to finish (a full run takes about half
# an hour on GitHub's two-processor runners, and tasks are merged more often than that, so cancelling
# meant no run ever completed); GitHub keeps only the newest waiting run, so at most one run waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Ubuntu 24.04 by name, not "ubuntu-latest" (R459): the project is built, verified and documented on 24.04
    # (the web view's packages, the WebDriver, the launch check). When GitHub moved "ubuntu-latest" to 26.04
    # (seen 2026-11-23) the desktop job could not install its packages: webkit2gtk-driver is renamed there.
    runs-on: ubuntu-24.04
    # A healthy run takes about 70 minutes on GitHub's machines (measured on 2026-11-17: the unit tests 19 minutes, the
    # steps before and after them about 11, the app's end-to-end scenarios about 40); a stuck one must not run for hours.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        # Pushes to branches other than main run one job (3.13); main, pull requests and manual runs run both.
        python: ${{ fromJSON(github.event_name == 'push' && github.ref != 'refs/heads/main' && '["3.13"]' || '["3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System tools for the media worker (proxies, OCR)
        # scripts/ci-apt-install.sh downloads with a time limit and, if the runner's mirror is slow, down or
        # unresolvable, retries from mirrors.edge.kernel.org and then from archive.ubuntu.com (three tries must fit in the step's limit).
        timeout-minutes: 15
        run: |
          bash scripts/ci-apt-install.sh tesseract-ocr ghostscript ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Media worker venv
        run: pnpm setup:py
        env:
          PYTHON: python
      - name: Pinned test fixtures
        run: pnpm fetch-fixtures
      - name: CSL styles and locales (pinned commits + sha256; generated, not committed)
        run: pnpm fetch-csl
      - run: pnpm -r typecheck
      - name: Build the UI package
        run: pnpm --filter @ao/ui run build
      # The library service as the desktop app ships it (Task 37a, ADR 0013): build the self-contained
      # folder, copy it outside the checkout, start it with plain node and run the smoke sequence.
      - name: Library service folder (build, then smoke-run it outside the repository)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        timeout-minutes: 10
        run: pnpm --filter @ao/library-service run smoke
      - name: UI style rules (CSS lint and colour scan)
        run: |
          pnpm --filter @ao/ui run lint:css
          pnpm --filter @ao/ui run lint:colours
      - name: Bundled fonts match their pinned checksums
        run: node packages/ui/scripts/fetch-fonts.mjs --check
      - run: pnpm test
      # Bulk Import at scale (10,000 items in < 120 s, RSS < 500 MB), on its own after the main suite.
      # The budget (120 s, 500 MB) is asserted by the test itself and is not changed here. Shared
      # runners vary by a factor of two between runs of identical code (64 s and 122 s on consecutive
      # runs, 2026-11-12), so a failed attempt is repeated once; both times go to the run summary so
      # a real slowdown shows as a trend (R166).
      - name: Scale test (time shown in the run summary; one repeat on a failed attempt)
        timeout-minutes: 15
        run: |
          set -o pipefail
          attempt() { pnpm test:scale 2>&1 | tee "$RUNNER_TEMP/scale.log"; }
          if ! attempt; then
            { echo "Scale test: first attempt failed; repeating once (R166)."; grep -h "bulk import 10k" "$RUNNER_TEMP/scale.log" || true; } >> "$GITHUB_STEP_SUMMARY"
            attempt
          fi
          grep -h "bulk import 10k" "$RUNNER_TEMP/scale.log" >> "$GITHUB_STEP_SUMMARY" || true
      - run: pnpm test:scripts
      - run: pnpm test:py
      - name: Install the browser for the extension end-to-end tests
        if: matrix.python == '3.13'
        run: pnpm --filter @ao/browser-extension exec playwright install --with-deps chromium
      - name: Browser extension end-to-end tests
        if: matrix.python == '3.13'
        run: pnpm e2e -- --extension-only --trace off
      # The app end to end (e2e/): the built UI, the real service and media worker, in Chromium and WebKit.
      - name: Install WebKit for the app end-to-end tests
        if: matrix.python == '3.13'
        run: pnpm --filter @ao/e2e exec playwright install --with-deps webkit
      - name: App end-to-end tests
        if: matrix.python == '3.13'
        run: pnpm e2e -- --app-only --trace off
      - run: pnpm report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-py${{ matrix.python }}
          path: reports/

  # Whether a push to a working branch touched the desktop app or what it is built from (the desktop
  # job below runs only then, on main and on manual runs: the repository is private and its build
  # minutes are limited). Read from GitHub's comparison of the push's first and last commits; a new
  # branch, or a comparison that cannot be read, counts as touched. The comparison lists at most 300
  # changed files (only on its first page), so a push with 300 or more counts as touched too.
  desktop-scope:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - id: diff
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename'); then
            echo "::warning::Could not compare $BEFORE...$AFTER; running the desktop job."
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ]; then
            echo "The push changed 300 files or more (the comparison's limit); running the desktop job."
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -E -q '^(apps/desktop/|apps/library-service/scripts/|services/media-worker/packaging/|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The desktop app on Linux (Tasks 37c, 37h): build it (build:linux, the Rust build cached), the
  # shell's Rust tests, the launch check (helpers start and stop; under xvfb-run), and the desktop
  # end-to-end scenario (the built app driven through its real window by WebDriver; it starts its own
  # private Xvfb and D-Bus, so it never types into a real screen). Its own job, so the test job's
  # time does not grow. No retries anywhere: a flaky run is a finding.
  desktop:
    needs: desktop-scope
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || needs.desktop-scope.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    # Estimated, not yet measured on GitHub (Task 37h report): about 15–20 minutes cold (a cold debug
    # build of the shell takes ~6–10 min on 2 vCPU) and 8–10 with a warm Rust cache, where the launch
    # check (~2.5 min) and the system packages (~2–3 min) dominate; the scenario takes ~15 s.
    #
    # Not yet seen on GitHub's runner, and the first things to look at if this job fails there:
    # - it runs as a non-root user: WebKitGTK's bubblewrap sandbox needs unprivileged user
    #   namespaces, which Ubuntu 24.04's AppArmor may restrict (the launch check meets it first);
    # - the X socket: the scenario closes the window over /tmp/.X11-unix/X<n>, or the abstract
    #   socket of that name when the folder is missing (e2e/x11.ts);
    # - the runner image's package set (the apt step names every package the build and checks use).
    timeout-minutes: 40
    env:
      # Smaller, faster-to-restore cache; incremental builds do not help a fresh runner.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: pnpm/action-setup@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: "3.13"
      - name: System packages (web view libraries, WebKitWebDriver, Xvfb, xdotool, ffmpeg)
        timeout-minutes: 15
        run: |
          # With their recommended packages (the web view's GL and portal pieces). GStreamer's plugins play
          # the launch check's audio and H.264 video in the web view; ffmpeg makes those files.
          bash scripts/ci-apt-install.sh \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential pkg-config libssl-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            webkit2gtk-driver xvfb xauth dbus dbus-x11 xdotool ffmpeg
      # What the cached builds depend on outside the repository, for their keys: the runner image's
      # system (ImageOS, e.g. ubuntu24; a runner variable, which the workflow's `env` context does not
      # see, hence this step) and the web view library the shell links against.
      - name: Runner image and web view version (for the cache keys)
        id: image
        timeout-minutes: 1
        run: |
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "webkit=$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-dev 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
      - name: Rust 1.97
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Rust build cache (crates and the shell's target folder)
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          # The shell's own sources are in the key, so the saved build follows them (restored from the
          # newest one with the same crates, then saved anew when they changed).
          key: desktop-rust-1.97.0-${{ runner.os }}-${{ steps.image.outputs.os }}-webkit-${{ steps.image.outputs.webkit }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('apps/desktop/src-tauri/src/**', 'apps/desktop/src-tauri/build.rs', 'apps/desktop/src-tauri/tauri.conf.json', 'apps/desktop/src-tauri/capabilities/**') }}
          restore-keys: |
            desktop-rust-1.97.0-${{ runner.os }}-${{ steps.image.outputs.os }}-webkit-${{ steps.image.outputs.webkit }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            desktop-rust-1.97.0-${{ runner.os }}-${{ steps.image.outputs.os }}-webkit-${{ steps.image.outputs.webkit }}-
      - name: tauri-driver cache
        id: tauri-driver
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: ~/.cargo-tools
          key: tauri-driver-2.1.0-rust-1.97.0-${{ runner.os }}-${{ steps.image.outputs.os }}
      - name: tauri-driver 2.1.0 (pinned; its own lockfile)
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: cargo install tauri-driver --version =2.1.0 --locked --root ~/.cargo-tools
      - run: echo "TAURI_DRIVER=$HOME/.cargo-tools/bin/tauri-driver" >> "$GITHUB_ENV"
        timeout-minutes: 1
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Media worker venv (the development worker the shell starts in these checks)
        timeout-minutes: 10
        run: pnpm setup:py
        env:
          PYTHON: python
      - name: CSL styles and locales (the service folder ships them)
        timeout-minutes: 5
        run: pnpm fetch-csl
      - name: Build the desktop app (service folder, notices, interface, shell)
        timeout-minutes: 25
        run: pnpm --filter @ao/desktop run build:linux
      # The crates only the Mac builds link (objc2, core-foundation, ...) through the same fail-closed
      # licence-text collection (R165, R167): a Cargo.lock change that brings in one without a licence is
      # found here, not on a Mac. Fetches those crates' sources once (crates.io); about a second after that.
      - name: Licence texts of the Mac targets' Rust crates
        timeout-minutes: 5
        run: pnpm --filter @ao/desktop run notices:targets
      - name: The shell's Rust tests
        timeout-minutes: 15
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Launch check (helpers start, answer and stop; scenarios A–F under xvfb-run)
        timeout-minutes: 15
        run: pnpm --filter @ao/desktop run launch-check
      - name: Desktop end-to-end scenario (the built app through its real window)
        timeout-minutes: 15
        run: pnpm e2e -- --desktop-only
      - run: pnpm report
        if: always()
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: always()
        with:
          name: desktop-reports
          path: reports/
          if-no-files-found: ignore
      # On failure: the shell's output (the shell's and the service's lines, written by the scenario
      # for a failed run) and Playwright's error context. The launch check prints the shell's output
      # in the step log itself.
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: failure()
        with:
          name: desktop-shell-output
          path: apps/desktop/e2e/test-results/
          if-no-files-found: ignore

  # The packaged media worker (Task 37d): a one-folder PyInstaller build for Linux, then its smoke
  # test. Only on main and on manual runs: it costs build minutes and changes rarely.
  worker-bundle:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    # A healthy run takes about 6 minutes (install, build, smoke test).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tools the smoke test hands to the worker (no ghostscript, as on a Mac)
        timeout-minutes: 15
        run: |
          bash scripts/ci-apt-install.sh --no-install-recommends tesseract-ocr ffmpeg
      - name: Pinned test fixtures
        run: node scripts/fetch-fixtures.mjs
      - name: The tiny speech model for the smoke test (outside the bundle)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ao-worker-smoke-models
          key: ao-worker-smoke-models-tiny-v1
      - name: Build the worker and run its smoke test
        env:
          PYTHON: python
        run: node apps/desktop/scripts/build-sidecars.mjs --smoke
      - name: Bundle size and manifest in the run summary
        if: always()
        run: |
          b=apps/desktop/sidecars/ao-worker-x86_64-unknown-linux-gnu
          [ -d "$b" ] || exit 0
          echo "Packaged worker: $(du -sh "$b" | cut -f1) on disk" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-bundle-report
          # The manifest and the smoke-test results only; the bundle itself (~540 MB) is not uploaded.
          path: |
            apps/desktop/sidecars/*/sidecar-manifest.json
            apps/desktop/sidecars/*.smoke.json
          if-no-files-found: ignore
